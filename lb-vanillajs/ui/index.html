<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Custom App Template</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="colors.css" />
        <link rel="stylesheet" href="frame.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    </head>
    <body>
        <div id="phone-wrapper">
            <div class="app" id="app">
                <div class="demo">
                    <div class="demo-header">
                        <div class="demo-title">Custom App Template</div>
                        <div class="demo-subtitle">Vanilla JS · facing <span id="direction">N</span></div>
                    </div>

                    <lb-group-header>Rows &amp; controls</lb-group-header>
                    <lb-inset-group id="controls">
                        <lb-row>
                            <lb-row-content>
                                <lb-row-title>Wi-Fi</lb-row-title>
                                <lb-row-subtitle>Static lb-* tags</lb-row-subtitle>
                            </lb-row-content>
                            <lb-row-trailing>
                                <lb-row-value>Home-5G</lb-row-value>
                                <lb-row-chevron></lb-row-chevron>
                            </lb-row-trailing>
                        </lb-row>
                        <lb-row>
                            <lb-row-content>
                                <lb-row-title>Airplane Mode</lb-row-title>
                            </lb-row-content>
                            <lb-row-trailing>
                                <lb-toggle></lb-toggle>
                            </lb-row-trailing>
                        </lb-row>
                    </lb-inset-group>

                    <lb-group-header>Phone components</lb-group-header>
                    <div id="components-list"></div>

                    <lb-group-header>Notifications</lb-group-header>
                    <div class="demo-field-row">
                        <input id="notification-text" placeholder="Notification text" value="Hello from my app!" />
                    </div>
                    <div id="notification-actions"></div>
                </div>
            </div>
        </div>

        <script src="dev.js"></script>
        <script>
            window.addEventListener('message', (event) => {
                if (event.data === 'componentsLoaded') {
                    const script = document.createElement('script');
                    script.src = 'script.js';
                    document.body.appendChild(script);

                    fetchNui('getDirection').then((direction) => {
                        document.getElementById('direction').innerText = direction;
                    });
                } else if (event.data?.type === 'updateDirection') {
                    document.getElementById('direction').innerText = event.data.direction;
                }
            });
        </script>
    </body>
</html>
